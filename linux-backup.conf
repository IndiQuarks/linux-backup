# /etc/linux-backup.conf
# Settings for linux-backup. Change ENABLED and SCHEDULE with the linux-backup
# command ("linux-backup disable", "linux-backup schedule ...") so the cron entry
# stays in step. If you edit this file by hand, run "linux-backup apply" afterwards.

# yes = the cron entry runs backups on schedule, no = scheduled backups are off
ENABLED="yes"

# When to run: minute hour day-of-month month day-of-week (numbers only)
SCHEDULE="0 2 * * *"

# Directories to archive, separated by spaces
SOURCES="/etc /home"

# Where archives are stored (root only, mode 700)
BACKUP_DIR="/backup"

# Archives older than this many days are removed after each backup
RETENTION_DAYS="7"

# Log file written by every run
LOG_FILE="/var/log/backup.log"
